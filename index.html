<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemeinsamer Eventkalender</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1b2433;--mute:#5d6b82;--line:#d5dbe6;--acc:#0f766e;--err:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:8px 0 4px}
p.sub{color:var(--mute);margin:0 0 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:600;margin-top:14px;cursor:pointer}
button.ghost{background:none;color:var(--acc);padding:4px 10px 4px 0;margin:0;font-weight:500}
button.del{color:var(--err)}
:focus-visible{outline:3px solid #7dd3c8;outline-offset:2px}
.ev{border-top:1px solid var(--line);padding:12px 0}.ev:first-child{border-top:0}
.ev b{font-size:1.05rem}.ev .meta{color:var(--mute);font-size:.9rem}
.tag{display:inline-block;background:#dff3f0;color:#0b524c;border-radius:20px;padding:1px 10px;font-size:.8rem;margin-left:6px}
.err{color:var(--err);margin-top:10px}.hide{display:none}
a{color:var(--acc)}summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<main>
<script>
const SUPABASE_URL = "https://jrpxzbymplqroxpmaqhf.supabase.co";
const SUPABASE_KEY = "sb_publishable_b5u3xVLT7pfg9-Q2TWe-MA_5cCOATQq";
</script>

<div id="create" class="hide">
  <h1>Neue Eventgruppe</h1>
  <p class="sub">Du wirst Admin der Gruppe. Alle anderen kommen mit Link und Gruppenpasswort.</p>
  <div class="box">
    <label for="gname">Gruppenname</label><input id="gname" maxlength="60">
    <label for="gpw">Gruppenpasswort (für alle Mitglieder)</label><input id="gpw" maxlength="60">
    <label for="gapw">Admin-Passwort (nur für dich)</label><input id="gapw" maxlength="60">
    <button id="gcreate">Gruppe erstellen</button><div id="gerr" class="err"></div>
  </div>
</div>

<div id="login" class="hide">
  <h1>Passwort eingeben</h1>
  <div class="box">
    <label for="lpw">Passwort</label><input id="lpw" type="password">
    <button id="lgo">Öffnen</button><div id="lerr" class="err"></div>
  </div>
</div>

<div id="app" class="hide">
  <h1 id="title"></h1>
  <p class="sub">Trag ein, worauf du Lust hast.</p>
  <div class="box">
    <div class="row">
      <div><label for="who">Dein Name</label><input id="who" maxlength="40"></div>
      <div><label for="kind">Art</label>
        <select id="kind"><option>Konzert</option><option>Comedy-Show</option><option>Stadtfest</option><option>Festival</option><option>Theater</option><option>Sport</option><option>Sonstiges</option></select></div>
    </div>
    <label for="etitle">Veranstaltung</label><input id="etitle" maxlength="120" placeholder="z. B. Eminem in Berlin">
    <div class="row">
      <div><label for="dfrom">Datum / von</label><input id="dfrom" type="date"></div>
      <div><label for="dto">bis (optional)</label><input id="dto" type="date"></div>
    </div>
    <div class="row">
      <div><label for="price">Preis in € (optional)</label><input id="price" type="number" min="0" step="0.01"></div>
      <div><label for="link">Link (optional)</label><input id="link" type="url" placeholder="https://"></div>
    </div>
    <button id="add">Event eintragen</button>
    <button id="cancel" class="ghost hide" style="margin-left:12px">Abbrechen</button>
    <div id="aerr" class="err"></div>
  </div>
  <div class="box">
    <label for="sort" style="margin-top:0">Sortieren nach</label>
    <select id="sort"><option value="date">Datum</option><option value="kind">Art</option><option value="price">Preis</option><option value="who">Eingetragen von</option><option value="title">Veranstaltung</option></select>
    <div id="list"></div>
  </div>
  <details id="adm" class="box hide">
    <summary>Admin-Bereich</summary>
    <p><button class="ghost" id="rg">Gruppenname ändern</button>
    <button class="ghost" id="pg">Gruppenpasswort ändern</button>
    <button class="ghost" id="pa">Admin-Passwort ändern</button></p>
    <b>Papierkorb</b>
    <div id="trash"></div>
  </details>
  <button class="ghost" id="share">Link kopieren</button>
  <button class="ghost" id="out">Abmelden</button>
</div>

<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const slug = new URLSearchParams(location.search).get("g");
let gid = null, cred = "", S = {events: [], trash: []}, editId = null;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => d ? new Date(d + "T00:00").toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric"}) : "";
const show = id => ["create","login","app"].forEach(x => $(x).classList.toggle("hide", x !== id));
const msg = e => /wrong password/.test(e.message) ? "Passwort falsch." : "Fehler: " + e.message;
const info = e => `${fmt(e.date_from)}${e.date_to ? " – " + fmt(e.date_to) : ""}${e.price != null ? " · " + Number(e.price).toLocaleString("de-DE") + " €" : ""}`;

async function load() {
  const {data, error} = await sb.rpc("get_events", {p_group: gid, p_cred: cred});
  if (error) return false;
  S = data; $("title").textContent = data.name;
  $("adm").classList.toggle("hide", !data.admin);
  show("app"); render(); renderTrash();
  return true;
}
async function act(fn, a) {
  const {error} = await sb.rpc(fn, {p_group: gid, p_cred: cred, ...a});
  if (error) { alert(msg(error)); return false; }
  await load(); return true;
}

function render() {
  const k = $("sort").value, de = new Intl.Collator("de");
  const s = [...S.events].sort((a, b) => {
    if (k === "date") return a.date_from.localeCompare(b.date_from);
    if (k === "price") return (a.price ?? Infinity) - (b.price ?? Infinity);
    return de.compare(a[k] || "", b[k] || "");
  });
  $("list").innerHTML = s.length ? s.map(e => {
    const link = /^https?:\/\//i.test(e.link || "") ? ` · <a href="${esc(e.link)}" target="_blank" rel="noopener">Link</a>` : "";
    return `<div class="ev"><b>${esc(e.title)}</b>${e.kind ? `<span class="tag">${esc(e.kind)}</span>` : ""}
      <div class="meta">${info(e)}${link}</div><div class="meta">von ${esc(e.who)}</div>
      <div><button class="ghost" data-a="edit" data-id="${e.id}">Bearbeiten</button><button class="ghost del" data-a="del" data-id="${e.id}">Löschen</button></div></div>`;
  }).join("") : '<p class="sub" style="margin-top:12px">Noch keine Events. Trag das erste ein.</p>';
}
function renderTrash() {
  $("trash").innerHTML = S.trash.length ? S.trash.map(e => `<div class="ev"><b>${esc(e.title)}</b>${e.kind ? `<span class="tag">${esc(e.kind)}</span>` : ""}
    <div class="meta">${info(e)} · von ${esc(e.who)}</div><div class="meta">gelöscht am ${new Date(e.deleted_at).toLocaleString("de-DE")}</div>
    <div><button class="ghost" data-a="res" data-id="${e.id}">Wiederherstellen</button><button class="ghost del" data-a="purge" data-id="${e.id}">Endgültig löschen</button></div></div>`).join("")
    : '<p class="sub">Der Papierkorb ist leer.</p>';
}
function resetForm() {
  ["etitle","dfrom","dto","price","link"].forEach(id => $(id).value = "");
  editId = null; $("add").textContent = "Event eintragen"; $("cancel").classList.add("hide"); $("aerr").textContent = "";
}

$("sort").onchange = render;
$("cancel").onclick = resetForm;

$("list").onclick = async ev => {
  const b = ev.target.closest("button"); if (!b) return;
  const e = S.events.find(x => x.id === b.dataset.id); if (!e) return;
  if (b.dataset.a === "del") {
    if (confirm("Event löschen? Der Admin kann es im Papierkorb wiederherstellen.")) { if (editId === e.id) resetForm(); await act("delete_event", {p_id: e.id}); }
    return;
  }
  editId = e.id; $("who").value = e.who; $("kind").value = e.kind || "Sonstiges"; $("etitle").value = e.title;
  $("dfrom").value = e.date_from; $("dto").value = e.date_to || ""; $("price").value = e.price ?? ""; $("link").value = e.link || "";
  $("add").textContent = "Änderung speichern"; $("cancel").classList.remove("hide");
  window.scrollTo({top: 0, behavior: "smooth"});
};

$("trash").onclick = ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.a === "res") act("restore_event", {p_id: b.dataset.id});
  if (b.dataset.a === "purge" && confirm("Endgültig löschen? Das lässt sich nicht rückgängig machen.")) act("purge_event", {p_id: b.dataset.id});
};

$("rg").onclick = () => { const n = prompt("Neuer Gruppenname?", S.name); if (n && n.trim()) act("rename_group", {p_name: n.trim()}); };
$("pg").onclick = async () => {
  const n = prompt("Neues Gruppenpasswort (mind. 4 Zeichen)?");
  if (n && n.length >= 4 && await act("set_passwords", {p_pw: n, p_admin_pw: null})) alert("Gespeichert. Gib das neue Passwort an die Gruppe weiter. Alle anderen müssen es beim nächsten Öffnen neu eingeben.");
};
$("pa").onclick = async () => {
  const n = prompt("Neues Admin-Passwort (mind. 4 Zeichen)?"); if (!n || n.length < 4) return;
  const {error} = await sb.rpc("set_passwords", {p_group: gid, p_cred: cred, p_pw: null, p_admin_pw: n});
  if (error) return alert(msg(error));
  cred = n; localStorage.setItem("c_" + slug, n); alert("Admin-Passwort geändert.");
};

$("add").onclick = async () => {
  const a = {p_who: $("who").value.trim(), p_title: $("etitle").value.trim(), p_kind: $("kind").value,
    p_from: $("dfrom").value || null, p_to: $("dto").value || null,
    p_price: $("price").value === "" ? null : Number($("price").value), p_link: $("link").value.trim() || null};
  if (!a.p_who || !a.p_title || !a.p_from) { $("aerr").textContent = "Name, Veranstaltung und Datum sind Pflicht."; return; }
  const ok = editId ? await act("update_event", {p_id: editId, ...a}) : await act("add_event", a);
  if (ok) { localStorage.setItem("who", a.p_who); resetForm(); }
};

$("gcreate").onclick = async () => {
  const n = $("gname").value.trim(), p = $("gpw").value, ap = $("gapw").value;
  if (!n || p.length < 4 || ap.length < 4) { $("gerr").textContent = "Name sowie beide Passwörter (mind. 4 Zeichen) eingeben."; return; }
  if (p === ap) { $("gerr").textContent = "Gruppen- und Admin-Passwort müssen verschieden sein."; return; }
  const {data, error} = await sb.rpc("create_group", {p_name: n, p_pw: p, p_admin_pw: ap});
  if (error) { $("gerr").textContent = msg(error); return; }
  localStorage.setItem("c_" + data, ap);
  location.search = "?g=" + data;
};

$("lgo").onclick = async () => {
  cred = $("lpw").value;
  if (await load()) localStorage.setItem("c_" + slug, cred);
  else $("lerr").textContent = "Passwort falsch oder Gruppe nicht gefunden.";
};

$("share").onclick = () => { navigator.clipboard.writeText(location.href); $("share").textContent = "Kopiert"; };
$("out").onclick = () => { localStorage.removeItem("c_" + slug); location.reload(); };

(async () => {
  $("who").value = localStorage.getItem("who") || "";
  if (!slug) return show("create");
  const {data} = await sb.rpc("resolve_group", {p_slug: slug});
  gid = data;
  if (!gid) { $("lerr").textContent = "Gruppe nicht gefunden. Prüfe den Link."; return show("login"); }
  cred = localStorage.getItem("c_" + slug) || "";
  if (!(cred && await load())) show("login");
})();
</script>
</main>
</body>
</html>
